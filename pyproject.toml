[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tokenforge"
version = "1.0.0"
description = "Turn repeated or deterministic AI work into tested Python handles that run for ~0 tokens."
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [
  { name = "Fabian Melomaciel" },
]
keywords = [
  "ai",
  "agents",
  "skills",
  "tokens",
  "automation",
  "cli",
  "opencode",
  "claude-code",
  "cursor",
  "codex",
]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.8",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Code Generators",
  "Topic :: Utilities",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/fabianmelomaciel/TokenForge"
Repository = "https://github.com/fabianmelomaciel/TokenForge"
Issues = "https://github.com/fabianmelomaciel/TokenForge/issues"
Changelog = "https://github.com/fabianmelomaciel/TokenForge/releases"

[project.scripts]
forge = "forge.cli:main"

[tool.setuptools]
packages = ["forge"]
include-package-data = false

[tool.setuptools.data-files]
"share/tokenforge" = ["SKILL.md"]
