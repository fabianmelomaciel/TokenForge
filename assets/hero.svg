<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" fill="none" role="img" aria-labelledby="heroTitle heroDesc">
  <title id="heroTitle">TokenForge — Forge once. Run forever.</title>
  <desc id="heroDesc">A dark forge scene with an anvil, sparks and a code motif. A token meter drops from 1,200 tokens to 0 tokens.</desc>

  <defs>
    <linearGradient id="brand" x1="72" y1="180" x2="640" y2="300" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fcd34d"/>
      <stop offset="0.52" stop-color="#f97316"/>
      <stop offset="1" stop-color="#fb7185"/>
    </linearGradient>
    <linearGradient id="cyan" x1="860" y1="100" x2="1000" y2="220" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#a5f3fc"/>
      <stop offset="0.55" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#0891b2"/>
    </linearGradient>
    <linearGradient id="hot" x1="850" y1="0" x2="1000" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fde68a"/>
      <stop offset="0.45" stop-color="#fbbf24"/>
      <stop offset="1" stop-color="#f97316"/>
    </linearGradient>
    <linearGradient id="meter" x1="72" y1="0" x2="262" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fbbf24" stop-opacity="0.34"/>
      <stop offset="1" stop-color="#f97316" stop-opacity="0.10"/>
    </linearGradient>
    <linearGradient id="divider" x1="0" y1="80" x2="0" y2="520" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f59e0b" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#f59e0b" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="amberGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#f59e0b" stop-opacity="0.22"/>
      <stop offset="0.55" stop-color="#f97316" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#f97316" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="cyanGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vignette" cx="0.5" cy="0.44" r="0.78">
      <stop offset="0.55" stop-color="#07070b" stop-opacity="0"/>
      <stop offset="1" stop-color="#07070b" stop-opacity="0.72"/>
    </radialGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" stroke="#ffffff" stroke-opacity="0.035" stroke-width="1"/>
    </pattern>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="16"/>
    </filter>
    <style>
      @media (prefers-reduced-motion: no-preference) {
        .spark { animation: spark 3.2s ease-in-out infinite; }
        .spark:nth-of-type(2n) { animation-delay: 0.7s; }
        .spark:nth-of-type(3n) { animation-delay: 1.4s; }
        .pulse { animation: pulse 4.5s ease-in-out infinite; }
        @keyframes spark {
          0%, 100% { opacity: 0.45; }
          50% { opacity: 1; }
        }
        @keyframes pulse {
          0%, 100% { opacity: 0.55; }
          50% { opacity: 0.9; }
        }
      }
    </style>
  </defs>

  <rect width="1200" height="600" fill="#07070b"/>
  <rect width="1200" height="600" fill="url(#grid)"/>
  <circle cx="948" cy="296" r="318" fill="url(#amberGlow)"/>
  <circle cx="150" cy="566" r="270" fill="url(#cyanGlow)"/>
  <rect width="1200" height="600" fill="url(#vignette)"/>

  <!-- Brand mark -->
  <g transform="translate(72 62)">
    <path d="M13 0 26 7.5v15L13 30 0 22.5v-15z" fill="#f59e0b" fill-opacity="0.08" stroke="#f59e0b" stroke-width="1.6"/>
    <path d="M13 7.5 19.5 11.25v7.5L13 22.5 6.5 18.75v-7.5z" fill="#fbbf24" fill-opacity="0.35"/>
    <circle cx="13" cy="15" r="1.8" fill="#fde68a"/>
    <text x="42" y="20" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="12" font-weight="700" letter-spacing="4" fill="#a1a1aa">TOKENFORGE / 1.0</text>
  </g>
  <text x="1128" y="82" text-anchor="end" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="11" letter-spacing="3" fill="#52525b">OPEN SOURCE · MIT</text>

  <!-- Headline -->
  <text x="72" y="252" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="100" font-weight="800" letter-spacing="-4" fill="url(#brand)">TokenForge</text>
  <text x="76" y="308" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="19" font-weight="700" letter-spacing="6.4" fill="#e4e4e7">FORGE ONCE. RUN FOREVER.</text>
  <text x="76" y="346" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="17" fill="#a1a1aa">Tested Python handles for repeatable agent work.</text>

  <!-- Token meter -->
  <text x="72" y="404" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="10.5" font-weight="600" letter-spacing="3.2" fill="#71717a">TOKEN COST PER RUN</text>

  <rect x="72" y="422" width="190" height="48" rx="10" fill="#14141c" stroke="#3f3f46"/>
  <rect x="72" y="422" width="190" height="48" rx="10" fill="url(#meter)"/>
  <text x="90" y="452" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="16" font-weight="600" fill="#fbbf24">1,200 tokens</text>

  <line x1="278" y1="446" x2="382" y2="446" stroke="#3f3f46" stroke-width="1.5" stroke-dasharray="4 6"/>
  <path d="M392 446l-11-6.5v13z" fill="#f59e0b"/>

  <rect x="408" y="422" width="160" height="48" rx="10" fill="#0c2428" stroke="#155e63"/>
  <text x="426" y="452" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="16" font-weight="600" fill="#67e8f9">0 tokens</text>

  <text x="72" y="502" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="11.5" fill="#52525b">Conservative estimate. Your mileage will vary.</text>

  <!-- Divider -->
  <line x1="700" y1="80" x2="700" y2="520" stroke="url(#divider)" stroke-width="1"/>

  <!-- Code badge -->
  <g class="pulse">
    <circle cx="930" cy="156" r="68" fill="none" stroke="#22d3ee" stroke-opacity="0.16" stroke-dasharray="3 8"/>
    <circle cx="930" cy="156" r="56" fill="#0b0b12" stroke="url(#cyan)" stroke-width="2"/>
    <text x="930" y="171" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="38" font-weight="700" fill="url(#cyan)">&lt;/&gt;</text>
  </g>

  <!-- Anvil -->
  <ellipse cx="930" cy="478" rx="208" ry="24" fill="#000000" fill-opacity="0.55"/>
  <ellipse cx="930" cy="466" rx="226" ry="34" fill="#f59e0b" fill-opacity="0.13" filter="url(#soft)"/>

  <path d="M812 320 738 338q-8 3 0 8l74 12z" fill="#1b1b23" stroke="#f59e0b" stroke-opacity="0.45" stroke-width="1.2"/>
  <path d="M812 318h220q16 0 16 16v12q0 12-16 12H812z" fill="#1f1f27" stroke="#3f3f46" stroke-width="1.2"/>
  <rect x="812" y="318" width="236" height="7" rx="3.5" fill="url(#brand)" opacity="0.9"/>
  <path d="M876 358h108l-18 72H894z" fill="#18181f" stroke="#3f3f46" stroke-width="1.2"/>
  <path d="M842 430h176l14 32H828z" fill="#1f1f27" stroke="#3f3f46" stroke-width="1.2"/>
  <rect x="828" y="458" width="204" height="4" rx="2" fill="#f59e0b" fill-opacity="0.35"/>

  <!-- Hot metal -->
  <rect x="850" y="302" width="150" height="12" rx="6" fill="url(#hot)" filter="url(#glow)"/>

  <!-- Sparks -->
  <g class="spark" stroke-linecap="round">
    <path d="M930 292v-46" stroke="#fbbf24" stroke-width="2" opacity="0.9"/>
    <path d="M902 298l-26-34" stroke="#f59e0b" stroke-width="1.6" opacity="0.7"/>
    <path d="M958 298l26-34" stroke="#f59e0b" stroke-width="1.6" opacity="0.7"/>
    <path d="M878 306l-38-18" stroke="#fbbf24" stroke-width="1.4" opacity="0.55"/>
    <path d="M982 306l38-18" stroke="#fbbf24" stroke-width="1.4" opacity="0.55"/>
  </g>
  <g class="spark" fill="#67e8f9">
    <circle cx="952" cy="252" r="2.2"/>
    <circle cx="892" cy="270" r="1.8"/>
    <circle cx="968" cy="278" r="1.6"/>
    <circle cx="866" cy="292" r="1.4"/>
    <circle cx="1014" cy="292" r="1.8"/>
  </g>
  <g class="spark" fill="#fde68a">
    <circle cx="918" cy="242" r="1.6"/>
    <circle cx="986" cy="264" r="1.4"/>
    <circle cx="844" cy="282" r="1.5"/>
  </g>

  <text x="930" y="512" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10.5" letter-spacing="2" fill="#52525b">.forge/handles · python · stdlib</text>

  <!-- Footer -->
  <text x="72" y="560" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="11.5" letter-spacing="1.6" fill="#3f3f46">MIT · PYTHON 3.8+ · ZERO DEPENDENCIES</text>
  <text x="1128" y="560" text-anchor="end" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="12" letter-spacing="0.6" fill="#52525b">github.com/fabianmelomaciel/TokenForge</text>
</svg>
